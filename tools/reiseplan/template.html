<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ulmer Schachtel – Rumänien-Reiseplaner</title>
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">
<style>
/* ============================================================
   MURIS — Atlas Design System
   Hansa-Weltatlas (Pfahl-Verlag, A. Zimmermann, 7th ed. 1952)
   ============================================================ */

@font-face {{ font-family:'Century Schoolbook L'; src:url('fonts/CenturySchL-Roma.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }}
@font-face {{ font-family:'Century Schoolbook L'; src:url('fonts/CenturySchL-Ital.ttf') format('truetype'); font-weight:400; font-style:italic; font-display:swap; }}
@font-face {{ font-family:'Century Schoolbook L'; src:url('fonts/CenturySchL-Bold.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }}
@font-face {{ font-family:'Century Schoolbook L'; src:url('fonts/CenturySchL-BoldItal.ttf') format('truetype'); font-weight:700; font-style:italic; font-display:swap; }}
@font-face {{ font-family:'BetecknaGS'; src:url('fonts/BetecknaGS.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }}
@font-face {{ font-family:'BetecknaGS'; src:url('fonts/BetecknaGS-Bold.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }}
@font-face {{ font-family:'Libre Franklin'; src:url('fonts/LibreFranklin-Regular.otf') format('opentype'); font-weight:400; font-style:normal; font-display:swap; }}
@font-face {{ font-family:'Libre Franklin'; src:url('fonts/LibreFranklin-Medium.otf') format('opentype'); font-weight:500; font-style:normal; font-display:swap; }}

:root {{
  /* --- driven by web.py -------------------------------------------------- */
  --bg:      {bg};
  --route:   {route_color};
  --station: {station_color};

  /* --- Muris palette (all sampled from Hansa-Weltatlas scans) ------------ */
  --paper:        #f4e7d1;
  --paper-lit:    #faf1df;
  --paper-deep:   #ece0c8;
  --sea:          #d8e0d6;
  --ink:          #3a2a26;
  --ink-soft:     #5c4a42;
  --ink-faint:    #8a786d;
  --hansa-rot:    #e2566f;
  --hansa-rot-hi: #c93a57;
  --index-red:    #c0392f;
  --line:         #cdbfa4;

  /* --- political area tints ----------------------------------------------- */
  --tint-rose:    #f1a8a4;
  --tint-straw:   #e7d27c;
  --tint-green:   #c4e2ba;
  --tint-apricot: #f7d3b6;

  /* --- typefaces ---------------------------------------------------------- */
  --font-display: 'BetecknaGS', ui-sans-serif, system-ui, sans-serif;
  --font-serif:   'Century Schoolbook L', 'Century Schoolbook', Georgia, serif;
  --font-ui:      'Libre Franklin', ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif;

  /* --- stroke ladder ------------------------------------------------------ */
  --stroke-hair:  0.5px;
  --stroke-fine:  0.75px;
  --stroke-base:  1px;
  --stroke-bold:  1.6px;
  --stroke-frame: 2px;
  --stroke-heavy: 3px;

  /* --- radii: the atlas is square-cornered -------------------------------- */
  --r-none: 0px;
  --r-sm:   2px;
}}

* {{ box-sizing: border-box; margin: 0; padding: 0; }}

body {{
  background: var(--paper);
  background-image:
    radial-gradient(circle at 18% 8%,  rgba(255,251,239,.55), transparent 42%),
    radial-gradient(circle at 82% 0%,  rgba(58,42,38,.06),    transparent 48%),
    repeating-linear-gradient(0deg, rgba(58,42,38,.018) 0 2px, transparent 2px 5px);
  color: var(--ink);
  font: 16px/1.55 var(--font-serif);
}}

/* ============================================================
   HEADER — atlas sheet-title register
   ============================================================ */
header {{
  text-align: center;
  padding: 1.4rem 1.25rem 1.1rem;
  border-bottom: var(--stroke-heavy) solid var(--ink);
  background: linear-gradient(var(--paper-lit), var(--paper));
}}
header h1 {{
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.95rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ink);
  line-height: 1.12;
}}
header p {{
  margin-top: .4rem;
  font-family: var(--font-serif);
  font-style: italic;
  color: var(--ink-soft);
  font-size: .95rem;
}}
/* Hansa-Rot hairline rule below title — substitutes for the atlas neat-line separator */
header h1::after {{
  content: '';
  display: block;
  width: 4rem;
  height: var(--stroke-bold);
  background: var(--hansa-rot);
  margin: .55rem auto 0;
}}

/* ============================================================
   MAP FRAME — double neat-line
   ============================================================ */
#map {{
  height: 65vh;
  min-height: 380px;
  width: 100%;
  border: var(--stroke-heavy) solid var(--ink);
  outline: var(--stroke-frame) solid var(--ink);
  outline-offset: -7px;
  box-shadow: inset 0 0 40px rgba(58,42,38,.18);
}}

/* ============================================================
   LEGEND BAR
   ============================================================ */
.legend {{
  display: flex;
  flex-wrap: wrap;
  gap: .6rem 1.2rem;
  padding: .65rem 1.25rem;
  background: var(--paper-lit);
  border-bottom: var(--stroke-base) solid var(--line);
  font-family: var(--font-serif);
  font-size: .87rem;
  color: var(--ink);
}}
.lg-row {{ display: flex; align-items: center; gap: .4rem; }}
.lg-line {{ width: 22px; height: 0; border-top: 2px dashed var(--route); }}
.lg-dot  {{ width: 11px; height: 11px; border-radius: 50%; background: var(--station); }}
.lg-circle  {{ width: 12px; height: 12px; border-radius: 50%; background: var(--c); }}
.lg-square  {{ width: 11px; height: 11px; background: var(--c); }}
.lg-triangle {{
  width: 0; height: 0;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-bottom: 12px solid var(--c);
}}
/* Info marker: sepia circle, index-red glyph */
.lg-info {{
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--paper-lit);
  font-family: var(--font-ui);
  font-size: 10px;
  line-height: 16px;
  text-align: center;
  font-weight: 700;
}}

/* ============================================================
   MAIN CONTENT COLUMN
   ============================================================ */
main {{
  max-width: 880px;
  margin: 0 auto;
  padding: 1.75rem 1.25rem 4rem;
}}

h2 {{
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 1.25rem;
  letter-spacing: .02em;
  color: var(--ink);
  border-bottom: var(--stroke-base) solid var(--line);
  padding-bottom: .25rem;
  margin-top: 2rem;
}}

h3 {{
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--ink);
}}

/* ============================================================
   ROUTE CARDS
   ============================================================ */
.route {{
  background: var(--paper-lit);
  border: var(--stroke-base) solid var(--line);
  border-radius: var(--r-none);
  padding: .75rem 1rem;
  margin: 1rem 0;
}}
.route h3 {{ margin: 0 0 .25rem; }}
.meta  {{ color: var(--ink-soft); }}
.conn  {{ margin: .4rem 0 0; color: var(--ink-soft); font-weight: 600; }}
.tags  {{ margin: .4rem 0 0; }}
.tag {{
  display: inline-block;
  background: rgba(231,210,124,.25);   /* tint-straw wash */
  color: var(--ink-soft);
  border: var(--stroke-hair) solid var(--line);
  border-radius: var(--r-none);
  padding: .05rem .55rem;
  margin: 0 .25rem .25rem 0;
  font-family: var(--font-ui);
  font-size: .78rem;
}}

/* ============================================================
   STOP LISTS & MISC
   ============================================================ */
ol.stops {{ margin: .5rem 0 0; padding-left: 1.4rem; }}
ol.stops li {{ margin: .15rem 0; }}
.hint  {{ color: var(--ink-faint); font-size: .9rem; }}
.empty, .note {{ color: var(--ink-faint); font-style: italic; }}
ul.dests {{ margin: .25rem 0 0; padding-left: 1.2rem; }}
.swatch {{
  display: inline-block;
  width: 11px; height: 11px;
  border-radius: var(--r-none);
  margin-right: .4rem;
  vertical-align: middle;
}}
a {{ color: var(--hansa-rot); text-decoration-thickness: var(--stroke-hair); }}
a:hover {{ color: var(--hansa-rot-hi); }}

/* ============================================================
   POI MARKERS (used in JS divIcon)
   ============================================================ */
.poi-marker {{ display: block; }}
.poi-marker.circle {{
  width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid var(--paper);
  box-shadow: 0 0 0 1px rgba(58,42,38,.45);
}}
.poi-marker.square {{
  width: 13px; height: 13px;
  border: 1.5px solid var(--paper);
  box-shadow: 0 0 0 1px rgba(58,42,38,.45);
}}
.poi-marker.triangle {{
  width: 0; height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  filter: drop-shadow(0 0 1px rgba(58,42,38,.5));
}}
/* dry micro-animation — 150ms opacity fade, no bounce */
.poi-marker {{ transition: transform 150ms ease-out; }}
.leaflet-marker-icon:hover .poi-marker {{ transform: scale(1.2); }}

/* ============================================================
   LEAFLET OVERRIDES — popups & chrome
   ============================================================ */
.leaflet-popup-content-wrapper {{
  background: var(--paper-lit);
  color: var(--ink);
  border: var(--stroke-base) solid var(--line);
  border-radius: var(--r-sm);
  box-shadow: 0 2px 8px rgba(58,42,38,.28);
  font-family: var(--font-serif);
  font-size: 1rem;
}}
.leaflet-popup-tip {{ background: var(--paper-lit); }}
.leaflet-popup-close-button {{ color: var(--ink-faint) !important; }}

/* ============================================================
   CUSTOM PANELS (historical survey overlay + sepia toggle)
   App chrome only — Libre Franklin.
   ============================================================ */
.ulm-panel {{
  background: var(--paper-lit);
  border: var(--stroke-base) solid var(--line);
  border-radius: var(--r-sm);
  padding: .5rem .65rem;
  font-family: var(--font-ui);
  font-size: .83rem;
  max-width: 220px;
  box-shadow: 0 1px 4px rgba(58,42,38,.18);
  color: var(--ink);
}}
.ulm-panel-title {{
  font-family: var(--font-ui);
  font-weight: 700;
  margin-bottom: .35rem;
  color: var(--hansa-rot);
  font-size: .83rem;
}}
.ulm-sel   {{ width: 100%; margin-bottom: .45rem; font-family: var(--font-ui); }}
.ulm-op    {{ display: block; font-size: .78rem; color: var(--ink-soft); }}
.ulm-range {{ width: 100%; margin-top: .2rem; }}
.ulm-btn {{
  font-family: var(--font-ui);
  font-size: .83rem;
  background: var(--paper-lit);
  color: var(--hansa-rot);
  cursor: pointer;
  border: var(--stroke-base) solid var(--line);
  border-radius: var(--r-sm);
  padding: .25rem .55rem;
  box-shadow: 0 1px 4px rgba(58,42,38,.15);
}}
.ulm-btn:hover {{ background: var(--paper-deep); }}

/* ============================================================
   SEPIA TILE FILTER (modern base tiles only)
   ============================================================ */
.leaflet-container.sepia .leaflet-tile-pane {{
  filter: sepia(.7) saturate(.85) contrast(.95) brightness(1.03);
}}

/* ============================================================
   ANIMATED ROUTE CORRIDORS ("marching ants")
   ============================================================ */
.route-ants {{ animation: ants 1.4s linear infinite; }}
@keyframes ants {{ to {{ stroke-dashoffset: -22; }} }}
</style>
</head>
<body>
<header>
  <h1>Ulmer Schachtel</h1>
  <p>Rumänien-Reiseplaner · Bahnverbindungen, Reiseziele, Habsburger Militärkarten</p>
</header>
<div id="map"></div>
<div class="legend">{legend}</div>
<main>
{overview}
{hist_blurb}
</main>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script id="reiseplan-data" type="application/json">
{data_js}
</script>
<script>
(function () {{
  var DATA = JSON.parse(document.getElementById('reiseplan-data').textContent);

  var map = L.map('map');

  // Basiskarten (umschaltbar)
  var osm = L.tileLayer('https://{{s}}.tile.openstreetmap.org/{{z}}/{{x}}/{{y}}.png', {{
    maxZoom: 19, attribution: '&copy; OpenStreetMap-Mitwirkende'
  }}).addTo(map);
  var clean = L.tileLayer('https://{{s}}.basemaps.cartocdn.com/light_nolabels/{{z}}/{{x}}/{{y}}.png', {{
    maxZoom: 20, attribution: '&copy; OpenStreetMap-Mitwirkende, &copy; CARTO'
  }});

  // Label-Overlay (eigene Pane über Basis, unter Daten)
  map.createPane('labelPane');
  map.getPane('labelPane').style.zIndex = 350;
  map.getPane('labelPane').style.pointerEvents = 'none';
  var labels = L.tileLayer('https://{{s}}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{{z}}/{{x}}/{{y}}.png', {{
    pane: 'labelPane', maxZoom: 20, attribution: '&copy; CARTO'
  }});

  function esc(s) {{
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }}

  // Routenkorridore (LineStrings)
  var routes = L.geoJSON(DATA.routes, {{
    style: {{ color: DATA.routeColor, weight: 3, dashArray: '6 5', opacity: .9, className: 'route-ants' }},
    onEachFeature: function (f, layer) {{
      var p = f.properties;
      layer.bindPopup(
        '<b>' + esc(p.route_name) + '</b><br>' +
        esc(p.from_city) + ' → ' + esc(p.to_city) +
        '<br>ca. ' + esc(p.length_km) + ' km' +
        '<br><small>' + esc(p.tags) + '</small>'
      );
    }}
  }}).addTo(map);

  // Bahnstationen (Punkte)
  var stations = L.geoJSON(DATA.stations, {{
    pointToLayer: function (f, latlng) {{
      return L.circleMarker(latlng, {{
        radius: 4, color: '#f4e7d1', weight: 1,
        fillColor: DATA.stationColor, fillOpacity: 1
      }});
    }},
    onEachFeature: function (f, layer) {{
      var p = f.properties;
      layer.bindPopup('<b>' + esc(p.name) + '</b><br>Station ' + esc(p.station_id));
    }}
  }}).addTo(map);

  // Reiseziele (POIs) – Form/Farbe je Kategorie
  var pois = L.geoJSON(DATA.pois, {{
    pointToLayer: function (f, latlng) {{
      var meta  = DATA.categoryMeta[f.properties.category] || {{}};
      var shape = meta.shape || 'circle';
      var color = meta.color || '#3a2a26';
      var style = shape === 'triangle'
        ? 'border-bottom-color:' + color
        : 'background:' + color;
      var icon = L.divIcon({{
        className: '',
        html: '<span class="poi-marker ' + shape + '" style="' + style + '"></span>',
        iconSize: [16, 16], iconAnchor: [8, 8]
      }});
      return L.marker(latlng, {{ icon: icon }});
    }},
    onEachFeature: function (f, layer) {{
      var p = f.properties;
      layer.bindPopup('<b>' + esc(p.name) + '</b><br>' + esc(p.notes || ''));
    }}
  }}).addTo(map);

  // Info-Marker — body enthält HTML
  var info = L.geoJSON(DATA.info, {{
    pointToLayer: function (f, latlng) {{
      var icon = L.divIcon({{
        className: '',
        html: '<span class="lg-info" style="width:22px;height:22px;line-height:22px;font-size:13px">i</span>',
        iconSize: [22, 22], iconAnchor: [11, 11]
      }});
      return L.marker(latlng, {{ icon: icon }});
    }},
    onEachFeature: function (f, layer) {{
      var p = f.properties;
      layer.bindPopup('<div style="max-width:260px">' + (p.body || '') + '</div>');
    }}
  }}).addTo(map);

  L.control.layers(
    {{ 'OpenStreetMap': osm, 'Hell, ohne Labels (CARTO)': clean }},
    {{
      'Orts-/Straßennamen': labels,
      'Routen': routes,
      'Bahnstationen': stations,
      'Reiseziele': pois,
      'Info': info
    }}, {{ collapsed: false }}).addTo(map);

  // --- Historische Karten (Arcanum) ---
  var HIST = {hist_surveys};
  map.createPane('histPane');
  map.getPane('histPane').style.zIndex = 300;
  var histLayer = null;
  function setHist(key, opacity) {{
    if (histLayer) {{ map.removeLayer(histLayer); histLayer = null; }}
    var s = HIST.filter(function (x) {{ return x.key === key; }})[0];
    if (s) {{
      histLayer = L.tileLayer(s.url, {{
        pane: 'histPane', maxNativeZoom: 14, maxZoom: 20,
        opacity: opacity, attribution: '&copy; Arcanum Maps (mapire.eu)'
      }}).addTo(map);
    }}
  }}
  var HistControl = L.Control.extend({{
    options: {{ position: 'topright' }},
    onAdd: function () {{
      var d = L.DomUtil.create('div', 'ulm-panel');
      var opts = '<option value="">— keine —</option>';
      HIST.forEach(function (s) {{
        opts += '<option value="' + s.key + '">' + s.label + '</option>';
      }});
      d.innerHTML =
        '<div class="ulm-panel-title">Historische Karte</div>' +
        '<select class="ulm-sel">' + opts + '</select>' +
        '<label class="ulm-op">Transparenz' +
        '<input class="ulm-range" type="range" min="0" max="100" value="70"></label>';
      L.DomEvent.disableClickPropagation(d);
      L.DomEvent.disableScrollPropagation(d);
      var sel = d.querySelector('.ulm-sel'), rng = d.querySelector('.ulm-range');
      sel.addEventListener('change', function () {{ setHist(sel.value, rng.value / 100); }});
      rng.addEventListener('input', function () {{
        if (histLayer) histLayer.setOpacity(rng.value / 100);
      }});
      return d;
    }}
  }});
  map.addControl(new HistControl());

  // --- Sepia-Umschalter ---
  var SepiaControl = L.Control.extend({{
    options: {{ position: 'topright' }},
    onAdd: function () {{
      var b = L.DomUtil.create('button', 'ulm-btn');
      b.type = 'button'; b.textContent = 'Sepia: aus';
      L.DomEvent.disableClickPropagation(b);
      b.addEventListener('click', function () {{
        var on = map.getContainer().classList.toggle('sepia');
        b.textContent = 'Sepia: ' + (on ? 'an' : 'aus');
      }});
      return b;
    }}
  }});
  map.addControl(new SepiaControl());

  L.control.scale({{ metric: true, imperial: false }}).addTo(map);

  // Ausschnitt über alle Features
  var group = L.featureGroup([routes, stations, pois, info]);
  var bounds = group.getBounds();
  if (bounds.isValid()) {{
    map.fitBounds(bounds, {{ padding: [20, 20] }});
  }} else {{
    map.setView([45.9, 25.0], 6);
  }}
}})();
</script>
</body>
</html>
