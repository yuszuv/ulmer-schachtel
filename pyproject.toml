[project]
name = "reiseplan-cli"
version = "0.2.0"
description = "Basis-CLI für den Rumänien-Reiseplaner (QGIS → QField)"
requires-python = ">=3.10"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
reiseplan-cli        = "reiseplan.cli:main"
reiseplan-cities     = "reiseplan.cities:main"
reiseplan-fetch      = "reiseplan.ingest:main"
reiseplan-wikivoyage = "reiseplan.wikivoyage:main"
reiseplan-natural    = "reiseplan.fetch_natural:main"
reiseplan-mining     = "reiseplan.thematic:_main_mining"
reiseplan-industry   = "reiseplan.thematic:_main_industry"
reiseplan-terrain    = "reiseplan.fetch_terrain:main"
reiseplan-landcover  = "reiseplan.fetch_landcover:main"
reiseplan-site       = "reiseplan.web:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# tools/ contains the reiseplan package — add it to the import path.
pythonpath = ["tools"]
testpaths  = ["tests"]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Include the whole package directory (Python files + template.html).
only-include = ["tools/reiseplan"]
sources      = ["tools"]

[tool.hatch.build.targets.wheel.force-include]
# Ensure the HTML template is bundled even though hatchling only auto-includes .py.
"tools/reiseplan/template.html" = "reiseplan/template.html"
