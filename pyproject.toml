[project]
name = "reiseplan-cli"
version = "0.1.0"
description = "Basis-CLI für den Rumänien-Reiseplaner (QGIS → QField)"
requires-python = ">=3.10"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
reiseplan-cli = "reiseplan_cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# tools/ liegt nicht im Paketpfad – für die Tests importierbar machen.
pythonpath = ["tools"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tools/reiseplan_cli.py", "tools/_paths.py", "tools/timetable.py"]
sources = ["tools"]
