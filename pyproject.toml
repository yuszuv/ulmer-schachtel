[project]
name = "reiseplan-cli"
version = "0.1.0"
description = "Basis-CLI für den Rumänien-Reiseplaner (QGIS → QField)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
reiseplan-cli = "reiseplan_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tools/reiseplan_cli.py"]
sources = ["tools"]
